name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode 16.4+
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          swift --version

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: 🔧 Patch Swift tools and syntax for Swift 6.1 compatibility
        run: |
          find . -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' {} + || true
          find . -name "Package.swift" -exec sed -i '' 's/swift-tools-version:6.2/swift-tools-version:6.0/g' {} + || true
          find . -name "*.swift" -exec sed -i '' 's/weak let/weak var/g' {} + || true
          find . -name "JavaScriptRuntime.swift" -exec sed -i '' 's/consuming JavaScriptValuesBuffer,/consuming JavaScriptValuesBuffer/g' {} + || true

      - name: 📱 Prebuild iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: 🍫 Install CocoaPods
        run: |
          cd ios
          pod install

      - name: 🔧 Patch Swift tools and syntax across workspace
        run: |
          find . -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' {} + || true
          find . -name "Package.swift" -exec sed -i '' 's/swift-tools-version:6.2/swift-tools-version:6.0/g' {} + || true
          find . -name "*.swift" -exec sed -i '' 's/weak let/weak var/g' {} + || true
          find . -name "JavaScriptRuntime.swift" -exec sed -i '' 's/consuming JavaScriptValuesBuffer,/consuming JavaScriptValuesBuffer/g' {} + || true

      - name: 🔨 Build iOS App (Unsigned for Sideloading)
        run: |
          xcodebuild \
            -workspace ios/AlmosalaPro.xcworkspace \
            -scheme AlmosalaPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 📦 Package .app into .ipa for Sideloadly
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "AlmosalaPro.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r AlmosalaPro.ipa Payload
          ls -lh AlmosalaPro.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlmosalaPro-iOS-IPA
          path: build/AlmosalaPro.ipa
          retention-days: 14
