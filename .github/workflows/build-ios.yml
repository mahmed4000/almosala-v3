name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🍏 Use Default Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version
          sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
          sudo xcodebuild -runFirstLaunch || true

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: 🔧 Run iOS Swift compatibility patches
        run: node scripts/patch-ios.js

      - name: 📱 Prebuild iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: 🍫 Install CocoaPods
        run: |
          cd ios
          pod install

      - name: 🔧 Re-run patches across workspace
        run: node scripts/patch-ios.js

      - name: 🔨 Build iOS App (Unsigned for Sideloading)
        run: |
          xcodebuild \
            -workspace ios/AlmosalaPro.xcworkspace \
            -scheme AlmosalaPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build

      - name: 📦 Package .app into .ipa for Sideloadly
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "AlmosalaPro.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r AlmosalaPro.ipa Payload
          ls -lh AlmosalaPro.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlmosalaPro-iOS-IPA
          path: build/AlmosalaPro.ipa
          retention-days: 14
